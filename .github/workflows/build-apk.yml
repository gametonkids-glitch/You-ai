name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Active Java major version could not be detected." >&2
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is $JAVA_MAJOR, which is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: The APK file $EXPECTED_APK is empty." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File $EXPECTED_APK does not have .apk extension." >&2
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          echo "Debug APK verified successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$RELEASE_DIR"
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F/ '{print $2}' | tr -c 'a-zA-Z0-9._-' '-')
          RUN_NUMBER="${{ github.run_number }}"
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Copied release asset is missing or empty at $ASSET_PATH" >&2
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset missing or invalid: $ASSET_PATH" >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset is not an APK file: $ASSET_PATH" >&2
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions run number: ${{ github.run_number }}
          GitHub Actions run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}

          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Publishing GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "$TAG_NAME"
            REPO_URL="https://github.com/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ### 🚀 Debug APK Release Published!

            - **Release Title:** $RELEASE_TITLE
            - **Release Tag:** \`$TAG_NAME\`
            - **Direct Release Page:** [$RELEASE_URL]($RELEASE_URL)
            - **Downloadable APK Asset:** \`$ASSET_NAME\`

            The APK can be downloaded directly to your phone from the release **Assets** section at the link above.
            The normal GitHub Actions artifact \`app-debug-apk\` is also available as a backup.
            EOF
          else
            echo "::warning::GitHub Release creation did not complete or was not permitted."
            echo "The debug APK build succeeded."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ### ⚠️ Debug APK Build Succeeded (Release Notice)

            The debug APK was built and verified successfully.
            The standard GitHub Actions artifact named \`app-debug-apk\` is available for download from this run.
            GitHub Release publishing did not complete or was not permitted. Please download the APK from the Actions **Artifacts** section.
            EOF
          fi
